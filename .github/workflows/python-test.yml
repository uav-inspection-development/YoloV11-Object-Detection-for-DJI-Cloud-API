# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: YOLOv11 Solar Panel Detection CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
        # run full flake8 check
        flake8 src --count --statistics

    - name: Type check with mypy
      run: |
        mypy src --ignore-missing-imports

    - name: Format check with black
      run: |
        black --check --diff src tests

    - name: Import sort check with isort
      run: |
        isort --check-only --diff src tests

    - name: Test with pytest
      run: |
        pytest tests/ --cov=src --cov-report=xml --cov-report=term-missing --verbose

    - name: Upload coverage reports to Codecov
      if: matrix.python-version == '3.10'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
        pip install -r requirements.txt
    
    - name: Run bandit security check
      run: |
        bandit -r src -f json -o bandit-report.json || true
        bandit -r src
    
    - name: Check dependencies for known security vulnerabilities
      run: |
        safety check --json --output safety-report.json || true
        safety check

  build-docs:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install sphinx sphinx-rtd-theme
    
    - name: Check README and documentation
      run: |
        # Check if README.md exists and is valid
        test -f README.md
        # Check if key documentation files exist
        test -f User_Manual.md
        test -f CONTRIBUTING.md
        test -f CHANGELOG.md
        echo "Documentation files check passed"

  validate-config:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate configuration files
      run: |
        # Check if configuration files are valid
        python -c "import configparser; c = configparser.ConfigParser(); c.read('.flake8')"
        python -c "import configparser; c = configparser.ConfigParser(); c.read('mypy.ini')"
        python -c "import configparser; c = configparser.ConfigParser(); c.read('setup.cfg')"
        echo "Configuration files validation passed"

  integration-test:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test import functionality
      run: |
        python -c "import sys; sys.path.append('src'); import model; print('Model import successful')"
        python -c "import sys; sys.path.append('src'); import utils; print('Utils import successful')"
    
    - name: Test basic functionality (without GPU)
      run: |
        # Test that main modules can be imported and basic functions work
        cd src
        python -c "
        import model
        import utils
        print('Basic functionality test passed')
        "

  notify:
    runs-on: ubuntu-latest
    needs: [test, security, build-docs, validate-config, integration-test]
    if: always()
    
    steps:
    - name: Notify completion
      run: |
        if [ "${{ needs.test.result }}" == "success" ] && \
           [ "${{ needs.security.result }}" == "success" ] && \
           [ "${{ needs.build-docs.result }}" == "success" ] && \
           [ "${{ needs.validate-config.result }}" == "success" ] && \
           [ "${{ needs.integration-test.result }}" == "success" ]; then
          echo "✅ All checks passed successfully!"
        else
          echo "❌ Some checks failed. Please review the logs."
          exit 1
        fi
