# Release workflow for creating releases and building executables
name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test-before-release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Run full test suite
      run: |
        flake8 src
        mypy src --ignore-missing-imports
        pytest tests/ --cov=src
    
    - name: Validate project structure
      run: |
        test -f README.md
        test -f LICENSE
        test -f requirements.txt
        test -d src
        test -d weights
        echo "Project structure validation passed"

  build-executable:
    needs: test-before-release
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable
      run: |
        pyinstaller --onefile --name yolov11-detector-${{ matrix.os }} main.py
    
    - name: Upload executable artifact
      uses: actions/upload-artifact@v3
      with:
        name: yolov11-detector-${{ matrix.os }}
        path: dist/yolov11-detector-${{ matrix.os }}*

  create-release:
    needs: [test-before-release, build-executable]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v3
    
    - name: Create release assets
      run: |
        # Create a source distribution
        zip -r yolov11-source-code.zip . -x "*.git*" "*/.*" "*/__pycache__/*" "*/build/*" "*/dist/*"
    
    - name: Upload release assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          yolov11-source-code.zip
          yolov11-detector-ubuntu-latest/*
          yolov11-detector-windows-latest/*
          yolov11-detector-macos-latest/*
        draft: false
        prerelease: false
